name: Schedule Trigger Test

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  test-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm scheduled trigger
        run: |
          echo "Schedule test triggered"
          echo "Event: ${{ github.event_name }}"
          echo "Time (UTC): $(date -u)"