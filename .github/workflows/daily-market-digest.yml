name: Daily Market Digest - AWS fallback watchdog

on:
  schedule:
    # 16:30–18:15 Asia/Kolkata (11:00–12:45 UTC).
    # AWS is primary at 16:00; this workflow checks shared state for recovery.
    - cron: '*/15 11 * * 1-5'
    - cron: '0,15,30,45 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-market-digest-fallback
  cancel-in-progress: false

jobs:
  fallback-if-needed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      DMD_STATE_TABLE: daily-market-digest-run-state
      DMD_STATE_BUCKET: ${{ vars.DMD_STATE_BUCKET }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '465'
      TIMEZONE: Asia/Kolkata
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run only if AWS failed or missed its deadline
        run: python scripts/run_automated.py --mode github-fallback

      - name: Save fallback diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-fallback-logs-${{ github.run_id }}
          path: logs/market_digest.log
          if-no-files-found: ignore
          retention-days: 14
