name: Build and publish Daily Market Digest image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/daily-market-digest.yml'
      - 'AWS_DEMO_COST_AND_TEARDOWN.md'
      - 'DEPLOYMENT_READINESS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-market-digest-image-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q

  publish-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Resolve ECR repository
        id: ecr
        shell: bash
        run: echo "uri=$(aws ecr describe-repositories --repository-names daily-market-digest --query 'repositories[0].repositoryUri' --output text)" >> "$GITHUB_OUTPUT"
      - name: Build and push immutable image, then update task definition
        env:
          ECR_URI: ${{ steps.ecr.outputs.uri }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_URI"
          docker build -t "$ECR_URI:$IMAGE_TAG" .
          docker push "$ECR_URI:$IMAGE_TAG"
          aws cloudformation update-stack \
            --stack-name daily-market-digest \
            --use-previous-template \
            --parameters \
              "ParameterKey=ImageTag,ParameterValue=$IMAGE_TAG" \
              "ParameterKey=SubnetIds,UsePreviousValue=true" \
              "ParameterKey=SecurityGroupIds,UsePreviousValue=true" \
              "ParameterKey=EmailSecretArn,UsePreviousValue=true" \
              "ParameterKey=GitHubOidcProviderArn,UsePreviousValue=true" \
              "ParameterKey=GitHubRepository,UsePreviousValue=true" \
              "ParameterKey=GitHubBranch,UsePreviousValue=true" \
              "ParameterKey=ScheduleState,UsePreviousValue=true" \
            --capabilities CAPABILITY_NAMED_IAM
          aws cloudformation wait stack-update-complete --stack-name daily-market-digest
